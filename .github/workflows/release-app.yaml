name: Release Set Conjurer

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [beta, stable]
        default: beta
      tag:
        description: Existing v-prefixed tag to build
        required: true
      publish:
        description: Publish the built artifacts to the tag's GitHub Release
        type: boolean
        default: false
      windows_signing:
        description: Sign when configured, require signing, or force an unsigned preview
        type: choice
        options: [auto, required, disabled]
        default: auto

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: '${{ inputs.tag }}'
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/about/
            !/askurza/
            !/converter/
            !/data/images/
            !/gallery/
            !/img/frames/*
            !/img/setSymbols/
            !/legal/
            !/phyrexian/
            !/theme/
            !/tutorial/
            !/launcher*
            /img/frames/cornerCutout.png
            /img/frames/maskRightHalf.png
            /img/frames/maskMiddleThird.png
            /img/frames/serial.png
      - uses: actions/setup-node@v5
        with: {node-version: 24}
      - name: Validate immutable release request
        run: node scripts/validate-release-request.mjs "${{ inputs.tag }}" "${{ inputs.channel }}"
      - name: Validate pinned frame-pack compatibility metadata
        run: node scripts/validate-app-pack-compatibility.mjs "${{ inputs.channel }}"
      - name: Require Apple signing and notarization secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGN_IDENTITY"
          test "$APPLE_SIGN_IDENTITY" != "-"
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"

  mac:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: '${{ inputs.tag }}'
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/about/
            !/askurza/
            !/converter/
            !/data/images/
            !/gallery/
            !/img/frames/*
            !/img/setSymbols/
            !/legal/
            !/phyrexian/
            !/theme/
            !/tutorial/
            !/launcher*
            /img/frames/cornerCutout.png
            /img/frames/maskRightHalf.png
            /img/frames/maskMiddleThird.png
            /img/frames/serial.png
      - uses: actions/setup-node@v5
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci-import-apple-certificate.sh
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build, sign, and notarize app
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run make -- --arch=${{ matrix.arch }}
      - name: Verify signed and notarized app bundles
        run: |
          found=0
          while IFS= read -r -d '' app; do
            found=1
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done < <(find out -type d -name '*.app' -prune -print0)
          test "$found" -eq 1
      - name: Notarize, staple, and verify final disk images
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          found=0
          while IFS= read -r -d '' dmg; do
            found=1
            codesign --verify --verbose=2 "$dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done < <(find out/make -type f -name '*.dmg' -print0)
          test "$found" -eq 1
      - uses: actions/upload-artifact@v4
        with: {name: 'release-mac-${{ matrix.arch }}', path: 'out/make/**'}

  windows:
    needs: preflight
    runs-on: windows-2025
    environment: release
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: '${{ inputs.tag }}'
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/about/
            !/askurza/
            !/converter/
            !/data/images/
            !/gallery/
            !/img/frames/*
            !/img/setSymbols/
            !/legal/
            !/phyrexian/
            !/theme/
            !/tutorial/
            !/launcher*
            /img/frames/cornerCutout.png
            /img/frames/maskRightHalf.png
            /img/frames/maskMiddleThird.png
            /img/frames/serial.png
      - uses: actions/setup-node@v5
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Determine Windows signing mode
        id: signing
        shell: pwsh
        env:
          REQUESTED_MODE: ${{ inputs.windows_signing }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $profileConfigured = ![string]::IsNullOrWhiteSpace($env:AZURE_ARTIFACT_SIGNING_PROFILE)
          if ($env:REQUESTED_MODE -eq 'required' -and !$profileConfigured) {
            throw 'Windows signing was required, but AZURE_ARTIFACT_SIGNING_PROFILE is not configured.'
          }
          $enabled = $env:REQUESTED_MODE -ne 'disabled' -and $profileConfigured
          if ($enabled) {
            $required = @(
              'AZURE_CLIENT_ID',
              'AZURE_TENANT_ID',
              'AZURE_SUBSCRIPTION_ID',
              'AZURE_ARTIFACT_SIGNING_ENDPOINT',
              'AZURE_ARTIFACT_SIGNING_ACCOUNT',
              'AZURE_ARTIFACT_SIGNING_PROFILE'
            )
            foreach ($name in $required) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "Windows signing is enabled, but $name is missing."
              }
            }
          }
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($enabled) {
            'Windows artifacts will be signed with Azure Artifact Signing.'
          } else {
            '::warning::Windows artifacts will be published unsigned for preview testing.'
          }
      - name: Sign in to Azure with GitHub OIDC
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Package Windows app
        run: npm run package -- --arch=x64
      - name: Locate Windows package
        shell: pwsh
        run: |
          $appDirs = @(Get-ChildItem -Path out -Directory | Where-Object { $_.Name -like '*-win32-x64' })
          if ($appDirs.Count -ne 1) {
            throw "Expected exactly one Windows x64 package directory, found $($appDirs.Count)."
          }
          "SET_CONJURER_WINDOWS_APP_DIR=$($appDirs[0].FullName)" >> $env:GITHUB_ENV
      - name: Sign packaged Windows app
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ env.SET_CONJURER_WINDOWS_APP_DIR }}
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Set Conjurer
          description-url: https://github.com/lawlordev/cardconjurer
      - name: Sign Squirrel updater
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\node_modules\electron-winstaller\vendor\Squirrel.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Set Conjurer
          description-url: https://github.com/lawlordev/cardconjurer
      - name: Build Squirrel installer
        run: npm run make -- --arch=x64 --skip-package
      - name: Sign Windows installer
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\make\squirrel.windows\x64
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Set Conjurer
          description-url: https://github.com/lawlordev/cardconjurer
      - name: Verify Windows release files
        shell: pwsh
        env:
          WINDOWS_SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'out\make\squirrel.windows\x64'
          $appExe = Join-Path $env:SET_CONJURER_WINDOWS_APP_DIR 'set-conjurer.exe'
          $setupExe = Join-Path $installerDir 'Set-Conjurer-Windows-x64-Setup.exe'
          $packages = @(Get-ChildItem -Path $installerDir -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Windows NuGet package, found $($packages.Count)."
          }
          $criticalFiles = @(
            $appExe
            $setupExe
            $packages[0].FullName
          )
          foreach ($file in $criticalFiles) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Expected Windows release file was not created: $file"
            }
          }
          if ($env:WINDOWS_SIGNED -eq 'true') {
            $packageZip = Join-Path $env:RUNNER_TEMP 'set-conjurer-release-package.zip'
            $expandedPackage = Join-Path $env:RUNNER_TEMP 'set-conjurer-release-package'
            Copy-Item -Path $packages[0].FullName -Destination $packageZip
            Expand-Archive -Path $packageZip -DestinationPath $expandedPackage -Force
            $embeddedUpdaters = @(Get-ChildItem -Path $expandedPackage -Recurse -Filter 'Squirrel.exe' -File)
            if ($embeddedUpdaters.Count -ne 1) {
              throw "Expected exactly one embedded signed Squirrel updater, found $($embeddedUpdaters.Count)."
            }
            foreach ($file in @($appExe, $setupExe, $embeddedUpdaters[0].FullName)) {
              $signature = Get-AuthenticodeSignature -FilePath $file
              if ($signature.Status -ne 'Valid') {
                throw "Invalid Authenticode signature for ${file}: $($signature.Status) $($signature.StatusMessage)"
              }
            }
          }
          $status = if ($env:WINDOWS_SIGNED -eq 'true') { 'SIGNED: Azure Artifact Signing verification passed.' } else { 'UNSIGNED PREVIEW: Windows trust warnings are expected.' }
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'out\make\WINDOWS-SIGNING.txt') -Value $status
      - uses: actions/upload-artifact@v4
        with: {name: release-windows-x64, path: 'out/make/**'}

  publish:
    if: inputs.publish
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release-assets, pattern: 'release-*', merge-multiple: true}
      - name: Create checksums and release notes
        env:
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS
          if [ "$WINDOWS_SIGNED" = 'true' ]; then
            windows_note='The Windows x64 installer is signed with Azure Artifact Signing.'
          else
            windows_note='The Windows x64 installer is an unsigned preview. Windows Defender SmartScreen warnings are expected.'
          fi
          printf '%s\n\n%s\n' 'Set Conjurer desktop release.' "$windows_note" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.channel == 'beta' }}
          make_latest: ${{ inputs.channel == 'stable' }}
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: release-assets/**
