name: Desktop CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run packs:compile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:desktop
      - run: npm run test:electron

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run packs:compile
      - run: npm run build:desktop
      - if: runner.os == 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        run: npm run test:electron
      - run: npx electron-forge package --arch=${{ matrix.arch }}
      - run: npm run package:verify
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run packs:seed
          $env:SET_CONJURER_INCLUDE_DEV_PACKS = '1'
          npx electron-forge package --arch=${{ matrix.arch }}
          $env:SET_CONJURER_TEST_EXECUTABLE = (Resolve-Path 'out/Set Conjurer-win32-x64/set-conjurer.exe').Path
          npm run test:electron
          Remove-Item Env:SET_CONJURER_INCLUDE_DEV_PACKS
          Remove-Item Env:SET_CONJURER_TEST_EXECUTABLE
          npx electron-forge package --arch=${{ matrix.arch }}
          npm run package:verify
      - if: runner.os == 'Windows'
        run: npm run make -- --arch=${{ matrix.arch }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path out -Recurse -Filter 'Set-Conjurer-Windows-x64-Setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Windows Setup executable was not produced.' }
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ runner.os }}-${{ matrix.arch }}
          path: out/**
          retention-days: 7
